server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8082
spring:
  application:
    name: assessment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/assessment_db}
    username: ${DB_USER:assessment_app}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
