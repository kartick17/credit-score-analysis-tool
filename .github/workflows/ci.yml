name: Build credit risk app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build all Java services
        run: ./mvnw -B clean verify
      - name: Create throwaway local database credentials
        run: python3 scripts/init-local-env.py
      - name: Start local data and identity
        run: ./scripts/db.sh up -d --wait
      - name: Confirm database ownership
        run: python3 scripts/check-db-isolation.py
      - name: Prepare sample staff accounts
        run: python3 scripts/identity.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json
      - name: Install portal dependencies
        working-directory: frontend/portal
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/portal
        run: npx playwright install --with-deps chromium
      - name: Run staff sign-in and role flows
        working-directory: frontend/portal
        run: npm run test:identity
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: identity-browser-failure-evidence
          path: frontend/portal/test-results/
      - name: Stop local containers
        if: always()
        run: ./scripts/db.sh down
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/portal/test-results/
