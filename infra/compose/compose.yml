name: credit-risk-day01
services:
  postgres:
    image: postgres:17.11
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-local-env.py}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Missing customer password}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?Missing assessment password}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Missing reporting password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bootstrap -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      - '127.0.0.1:8180:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run python3 scripts/init-local-env.py}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - identity:/opt/keycloak/data
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped
volumes:
  identity:
  pgdata:
